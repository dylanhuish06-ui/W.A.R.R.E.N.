name: Research CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test offline research code
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Generate synthetic data and run CLI smoke test
        run: |
          python scripts/generate_demo_data.py --output data/demo_prices.csv
          PYTHONPATH=src python -m warren.cli backtest --prices data/demo_prices.csv --output outputs/demo_report.json
          test -s outputs/demo_report.json
