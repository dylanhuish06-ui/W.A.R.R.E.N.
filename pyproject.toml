[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warren-trading-research"
version = "0.1.0"
description = "W.A.R.R.E.N.: safe, reproducible long-only UK equity research"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
warren = "warren.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
